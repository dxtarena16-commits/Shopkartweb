<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ShopKart – Shop for everything</title>
<style>
:root{--bg:#f1f3f6;--cd:#fff;--tx:#212121;--mu:#717478;--bd:#e3e5ea;--bl:#2874f0;--pk:#f43397;--gr:#16a34a;--yl:#ffe500;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0f14;--cd:#1a1c24;--tx:#f0f1f5;--mu:#9a9fb0;--bd:#2b2e3a}}
:root[data-theme="dark"]{--bg:#0e0f14;--cd:#1a1c24;--tx:#f0f1f5;--mu:#9a9fb0;--bd:#2b2e3a}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:Roboto,system-ui,-apple-system,Segoe UI,sans-serif;font-size:14px}
button,input{font:inherit;color:inherit}
#app{max-width:720px;margin:0 auto;padding-bottom:calc(70px + env(safe-area-inset-bottom,0px))}
.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bl);padding:10px 12px;color:#fff}
.hd .r{display:flex;align-items:center;gap:10px;margin-bottom:8px}.lg{font-weight:800;font-size:20px;font-style:italic;margin-right:auto}.lg b{color:var(--yl)}
.hd button{background:none;border:0;color:#fff;font-weight:600;cursor:pointer}
.sr{width:100%;border:0;border-radius:6px;padding:11px 12px;background:#fff;color:#212121}
.cats{display:flex;gap:6px;overflow-x:auto;background:var(--cd);padding:10px 8px;scrollbar-width:none}
.ct{flex:0 0 66px;text-align:center;font-size:12px;cursor:pointer;border:0;background:none}.ct i{display:grid;place-items:center;width:52px;height:52px;margin:0 auto 4px;border-radius:50%;background:var(--bg);font-style:normal;font-size:26px}.ct.on i{outline:2px solid var(--bl)}
.bn{position:relative;margin:8px;overflow:hidden;border-radius:10px}.bt{display:flex;transition:.5s}.bs{flex:0 0 100%;padding:22px 18px;min-height:130px;color:#fff;cursor:pointer}.bs h2{margin:0 0 4px;font-size:22px}.bs p{margin:0 0 10px}.bs span{background:#fff;color:#111;border-radius:20px;padding:5px 14px;font-weight:700;font-size:12px}
.dots{position:absolute;bottom:6px;left:0;right:0;display:flex;justify-content:center;gap:5px}.dots u{width:6px;height:6px;border-radius:3px;background:#fff6}.dots u.on{background:#fff;width:14px}
.sec{background:var(--cd);margin:8px 0;padding:12px}.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.sh h3{margin:0;font-size:17px}.tm{background:#e53935;color:#fff;border-radius:4px;padding:2px 7px;font-weight:700;font-size:12px}
.hs{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none}.hs .c{flex:0 0 130px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 8px}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
.c{background:var(--cd);border-radius:8px;overflow:hidden;border:1px solid var(--bd);display:flex;flex-direction:column}
.im{font-size:56px;text-align:center;padding:16px 0;background:linear-gradient(135deg,#0000,#0001)}
.cb{padding:8px 10px 10px;display:flex;flex-direction:column;gap:3px;flex:1}.nm{font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:34px}
.pr b{font-size:16px}.pr s{color:var(--mu);font-size:12px;margin:0 4px}.pr em{color:var(--gr);font-style:normal;font-weight:700;font-size:12px}
.rt{display:inline-block;background:var(--gr);color:#fff;font-size:11px;font-weight:700;border-radius:4px;padding:1px 5px}.rv{color:var(--mu);font-size:11px;margin-left:4px}
.ad{margin-top:auto;border:0;background:var(--pk);color:#fff;font-weight:700;border-radius:6px;padding:8px;cursor:pointer}
.fd{font-size:11px;color:var(--gr)}
.pg{padding:12px}.cd{background:var(--cd);border-radius:10px;padding:14px;margin-bottom:10px;border:1px solid var(--bd)}
